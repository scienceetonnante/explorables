<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive scientific explorations - Physics, biology simulations and more">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Explorables - Science Étonnante</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">🔬 Explorables</h1>
            <p class="tagline">Interactive Scientific Simulations</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <!-- Filter Section -->
            <section class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="physics">Physics</button>
                <button class="filter-btn" data-filter="biology">Biology</button>
                <button class="filter-btn" data-filter="mathematics">Mathematics</button>
                <button class="filter-btn" data-filter="chemistry">Chemistry</button>
            </section>

            <!-- Loading State -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Loading simulations...</p>
            </div>

            <!-- Gallery Grid -->
            <section id="gallery" class="gallery" style="display: none;">
                <!-- Cards will be injected by JavaScript -->
            </section>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>🔍 No simulations found for this category</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 <a href="https://www.scienceetonnante.com" target="_blank">Science Étonnante</a> - All rights reserved</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>

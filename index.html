<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explorations scientifiques interactives - Simulations de physique, biologie et plus">
    <title>Explorables - Science Étonnante</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">🔬 Explorables</h1>
            <p class="tagline">Simulations scientifiques interactives</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <!-- Filter Section -->
            <section class="filters">
                <button class="filter-btn active" data-filter="all">Tout</button>
                <button class="filter-btn" data-filter="physics">Physique</button>
                <button class="filter-btn" data-filter="biology">Biologie</button>
                <button class="filter-btn" data-filter="mathematics">Mathématiques</button>
                <button class="filter-btn" data-filter="chemistry">Chimie</button>
            </section>

            <!-- Loading State -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Chargement des simulations...</p>
            </div>

            <!-- Gallery Grid -->
            <section id="gallery" class="gallery" style="display: none;">
                <!-- Cards will be injected by JavaScript -->
            </section>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>🔍 Aucune simulation trouvée pour cette catégorie</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 <a href="https://www.scienceetonnante.com" target="_blank">Science Étonnante</a> - Tous droits réservés</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pisa Tower Free Fall Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-B1pBB4dA.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DtAapnF4.css">
</head>
<body>
  <header class="header container">
    <h1 class="header__title">Galileo's experiment : Free fall from the Pisa Tower</h1>
  </header>

  <main class="container simulation-grid">
    <!-- Controls Panel -->
    <section class="panel controls-panel">
      <form class="form">
        <!-- Blue Ball Controls -->
        <div class="control-group">
          <h3 class="control-group__label">🔵 Blue Ball</h3>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="blueMass">Mass</label>
              <span class="control__value" id="blueMassValue">33.0 kg</span>
            </div>
            <input id="blueMass" type="range" min="0.5" max="200" step="0.5" value="33.0" data-initial="33.0">
          </div>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="blueDensity">Density</label>
              <span class="control__value" id="blueDensityValue">7850 kg/m³</span>
            </div>
            <input id="blueDensity" type="range" min="500" max="11000" step="50" value="7850" data-initial="7850">
          </div>
          <div class="control">
            <div class="control__row">
              <label class="control__label">Diameter</label>
              <span class="control__value control__value--readonly" id="blueDiameterValue">0.20 m</span>
            </div>
          </div>
        </div>

        <!-- Red Ball Controls -->
        <div class="control-group">
          <h3 class="control-group__label">🔴 Red Ball</h3>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="redMass">Mass</label>
              <span class="control__value" id="redMassValue">4 kg</span>
            </div>
            <input id="redMass" type="range" min="0.5" max="200" step="0.5" value="4" data-initial="4">
          </div>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="redDensity">Density</label>
              <span class="control__value" id="redDensityValue">1000 kg/m³</span>
            </div>
            <input id="redDensity" type="range" min="500" max="11000" step="50" value="1000" data-initial="1000">
          </div>
          <div class="control">
            <div class="control__row">
              <label class="control__label">Diameter</label>
              <span class="control__value control__value--readonly" id="redDiameterValue">0.10 m</span>
            </div>
          </div>
        </div>

        <!-- Environment Controls -->
        <div class="control-group">
          <h3 class="control-group__label">Environment</h3>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="gravity">Gravity</label>
              <span class="control__value" id="gravityValue">9.81 m/s²</span>
            </div>
            <input id="gravity" type="range" min="1" max="20" step="0.01" value="9.81" data-initial="9.81">
          </div>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="airDensity">
                Air Density
                <span class="tooltip-icon" data-tooltip="Drag force is proportional to air density and velocity squared, assuming a spherical shape with drag coefficient Cd = 0.47">ⓘ</span>
              </label>
              <span class="control__value" id="airDensityValue">1.25 kg/m³</span>
            </div>
            <input id="airDensity" type="range" min="0" max="5" step="0.05" value="1.25" data-initial="1.25">
          </div>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="timeScale">Time Scale</label>
              <span class="control__value" id="timeScaleValue">1.00×</span>
            </div>
            <input id="timeScale" type="range" min="0.1" max="1" step="0.05" value="1" data-initial="1">
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="row mt-3">
          <button class="btn btn--primary" type="button" id="playPauseBtn">Play</button>
          <button class="btn btn--secondary" type="button" id="resetBtn">Reset</button>
          <button class="btn btn--secondary" type="button" id="initialBtn">Initial</button>
        </div>
      </form>
    </section>

    <!-- Viewport Panel -->
    <section class="viewport-panel">
      <canvas id="viewport"></canvas>
    </section>

    <!-- Graphs Panel - stacked vertically on the right -->
    <section class="graphs-panel">
      <canvas id="positionGraph"></canvas>
      <canvas id="velocityGraph"></canvas>
    </section>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fall Towers - Interactive Simulation</title>
  <script type="module" crossorigin src="./free-fall-towers.js"></script>
  <link rel="stylesheet" crossorigin href="./free-fall-towers.css">
</head>
<body>
  <header class="header container">
    <h1 class="header__title">Free Fall Towers</h1>
  </header>

  <main class="container grid-2">
    <section class="panel">
      <form class="form">
        <div class="control-group">
          <h3 class="control-group__label">Launch</h3>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="leftVelocity">Velocity</label>
              <span class="control__value" id="leftVelocityValue">20.0 m/s</span>
            </div>
            <input id="leftVelocity" type="range" min="0" max="50" step="0.5" value="20">
          </div>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="leftAngle">Angle</label>
              <span class="control__value" id="leftAngleValue">25°</span>
            </div>
            <input id="leftAngle" type="range" min="-90" max="90" step="1" value="25">
          </div>
        </div>

        <div class="control-group">
          <h3 class="control-group__label">Simulation</h3>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="animationSpeed">Speed</label>
              <span class="control__value" id="animationSpeedValue">1.0x</span>
            </div>
            <input id="animationSpeed" type="range" min="0" max="1" step="0.05" value="1">
          </div>
          <div class="control">
            <div class="control__row">
              <label class="control__label" for="showGuides">
                <input type="checkbox" id="showGuides" unchecked> Show Position Guides
              </label>
            </div>
          </div>
        </div>

        <div class="row mt-2">
          <button class="btn btn--primary" type="button" id="launchBtn">Launch</button>
          <button class="btn btn--secondary" type="button" id="resetBtn">Reset</button>
        </div>
      </form>
    </section>

    <section class="viz panel">
      <canvas id="viewport" width="800" height="600"></canvas>
      <div id="statusMessage" class="status" style="margin-top: 12px; display: none;"></div>
    </section>
  </main>

</body>
</html>
